aid: kuru
name: Kuru
description: >-
  Kuru is a fully on-chain central limit order book (CLOB) decentralized
  exchange and smart routing aggregator built on Monad, operated by Kuru Labs.
  It combines an on-chain order book with AMM vault liquidity to deliver
  low-slippage, self-custody trading, and exposes the Kuru Flow API — a
  liquidity-aggregating routing engine that lets wallets, dApps and aggregators
  quote and build any-token-to-any-token swaps across every market on Monad,
  optionally appending their own referrer fee. Developers integrate through a
  TypeScript SDK, a Python CLOB SDK for market making, published and audited
  Solidity contracts, and a first-party agent skill for automated trading.
