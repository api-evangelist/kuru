api: Kuru Flow API / Kuru protocol
summary: >-
  Kuru's test surface is a Monad testnet deployment with its own published
  contract addresses, token and market. There is no hosted HTTP sandbox for the
  Kuru Flow API and no test API key programme — integrators point the SDK at a
  Monad testnet RPC and the testnet contract set. All values below are
  transcribed verbatim from Kuru's published address tables.
hosted_http_sandbox:
  present: false
  note: >-
    ws.kuru.io has no documented sandbox host. Quote calls are read-only, so
    testing is typically done against mainnet routing with unsigned
    (prepare-mode) transactions rather than a mock server.
