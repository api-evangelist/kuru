testnet_sdk_config:
  source: https://docs.kuru.io/sdk/quickstart-sdk
  note: The quickstart ships a testnet config.json with these values.
  config:
    rpcUrl: monad_rpc_url
    marginAccountAddress: '0xdDDaBd30785bA8b45e434a1f134BDf304d6125d9'
    routerAddress: '0x1f5A250c4A506DA4cE584173c6ed1890B1bf7187'
  caveat: >-
    These two quickstart testnet addresses differ from the testnet table on the
    Contract Addresses page. Both are recorded as published; integrators should
    treat the Contract Addresses page as authoritative.
dry_run:
  supported: true
  mechanism: prepare-mode
  note: >-
    Kuru's own agent skill exposes `prepare buy` / `prepare sell`, which return
    ordered UNSIGNED transaction requests (approval first when allowance is
    short, then the swap). This is the safest way to exercise the full flow
    without broadcasting.
  source: https://github.com/Kuru-Labs/kuru-trading-skills
  quote_only: >-
    POST /api/quote is read-only and can be called freely to exercise routing
    without any on-chain effect.
credentials:
  test_api_keys: none published
  required_env:
    - MONAD_RPC_URL
    - KURU_PRIVATE_KEY (live broadcast only; not needed for prepare mode)
    - KURU_WALLET_ADDRESS (prepare mode alternative to a private key)
