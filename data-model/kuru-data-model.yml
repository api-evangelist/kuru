onchain_entities:
  - name: Router
    role: Market factory and central orchestrator
    docs: https://docs.kuru.io/contracts/Router
    emits: [MarketRegistered]
  - name: OrderBook
    role: Central limit order book implementation, one per market
    docs: https://docs.kuru.io/contracts/OrderBook
    emits: [Trade, OrderCreated]
  - name: MarginAccount
    role: Per-user balance custody funding order placement
    docs: https://docs.kuru.io/contracts/MarginAccount
  - name: KuruAMMVault
    role: AMM liquidity vault providing passive liquidity to a market
    docs: https://docs.kuru.io/contracts/KuruAMMVault
  - name: Market
    role: A trading pair (e.g. MON-USDC), addressed by contract
  - name: Token
    role: ERC-20 token on Monad
    id_format: '^0x[a-fA-F0-9]{40}$'
  - name: Order
    role: A resting or filled order
    id_field: orderId
    id_type: uint40
    note: Emitted in OrderCreated(uint40,address,uint96,uint32,bool)
relationships:
  - from: Router
    to: Market
    type: has_many
    via: MarketRegistered event
    evidence: https://docs.kuru.io/contracts/Integration
  - from: Market
    to: OrderBook
    type: has_one
    via: market address is the OrderBook contract
  - from: Market
    to: Token
    type: has_many
    via: base/quote token pair
  - from: OrderBook
    to: Order
    type: has_many
    via: orderId
  - from: Order
    to: Trade
    type: has_many
    via: orderId in Trade event
  - from: MarginAccount
    to: Token
    type: has_many
    via: per-token user balance
  - from: KuruAMMVault
    to: Market
    type: belongs_to
    via: vault provides liquidity to one market
  - from: CalculateBestPathResponse
    to: Market
    type: has_many
    via: path (SwapRoute) traverses one or more markets
indexing:
  note: >-
    Kuru documents a two-event indexing recipe — listen to Router
    MarketRegistered to discover every market, then subscribe to each market's
    OrderBook Trade event.
  docs: https://docs.kuru.io/contracts/Integration
  events:
    - name: MarketRegistered
      source: Router
    - name: Trade
      source: OrderBook
      signature: Trade(uint40,address,bool,uint256,uint96,address,address,uint96)
    - name: OrderCreated
      source: OrderBook
      signature: OrderCreated(uint40,address,uint96,uint32,bool)
